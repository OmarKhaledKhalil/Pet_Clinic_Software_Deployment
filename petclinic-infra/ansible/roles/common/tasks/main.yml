---

- name: Set timezone
  command: timedatectl set-timezone {{ timezone }}

- name: Update the apt package index
  apt:
    update_cache: yes

- name: Install required packages
  apt:
    name:
      - curl
      - wget
      - vim
      - git
      - net-tools
      - dnsutils
      - software-properties-common
      - lvm2
    state: present

- name: Disable swap
  command: swapoff -a
  when: ansible_swaptotal_mb > 0

- name: Comment out swap line in /etc/fstab
  replace:
    path: /etc/fstab
    regexp: '^([^#].*swap)'
    replace: '# \1'

- name: Load br_netfilter module
  shell: echo br_netfilter | sudo tee /etc/modules-load.d/br_netfilter.conf
  register: br_netfilter_module

- name: Enable br_netfilter module
  modprobe:
    name: br_netfilter
    state: present
  when: br_netfilter_module.changed

- name: Set sysctl params for Kubernetes
  copy:
    dest: /etc/sysctl.d/k8s.conf
    content: |
      net.bridge.bridge-nf-call-ip6tables = 1
      net.bridge.bridge-nf-call-iptables = 1
      net.ipv4.ip_forward = 1

- name: Apply sysctl settings
  command: sysctl --system
