# 1. Checkout
# -----------------------------------------------------------------------------
- stage: Checkout
  displayName: 'Checkout Stage'
  jobs:
    - job: Checkout
      pool:
        vmImage: 'windows-latest'
      steps:
        - checkout: self
          clean: true

# -----------------------------------------------------------------------------
